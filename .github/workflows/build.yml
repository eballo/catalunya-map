name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Install dependencies
        run: yarn
      - name: Test and coverage
        run: yarn jest --coverage
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
    - run: npm test

  release:
    name: Bump version, tag and release
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, 'Bump version:')
    needs: [ sonarcloud, build ]
    runs-on: ubuntu-latest
    # One release at a time (shared with release.yml): a run that starts while
    # another is releasing waits instead of racing it to push main. GitHub keeps
    # only one pending run per group, so an intermediate one can be cancelled —
    # that is fine, because each run releases every PR merged since the last
    # tag, not just its own. See catalunya-medieval-skills/docs/releases.md.
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout main (full history + tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Collect PRs since the last tag and determine bump level
        id: bump
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          RANGE="${LAST_TAG:+$LAST_TAG..}HEAD"
          echo "Last tag: ${LAST_TAG:-<none>}"

          # Highest level wins: major > minor > patch
          RANK=0
          : > /tmp/release-entries.txt
          for SHA in $(git log --reverse --format=%H "$RANGE"); do
            SUBJECT=$(git log -1 --format=%s "$SHA")
            BODY=$(git log -1 --format=%B "$SHA")
            case "$SUBJECT" in "Bump version:"*) continue ;; esac

            PR_JSON=$(gh api "repos/$REPO/commits/$SHA/pulls" 2>/dev/null || echo '[]')
            PR_NUMBER=$(printf '%s' "$PR_JSON" | jq -r '.[0].number // empty')

            if [ -n "$PR_NUMBER" ]; then
              SRC_BRANCH=$(printf '%s' "$PR_JSON" | jq -r '.[0].head.ref // empty')
              ENTRY="$(printf '%s' "$PR_JSON" | jq -r '.[0].title') (#$PR_NUMBER)"
            else
              # Direct pushes to main that skipped CI (docs, templates) are not releases
              case "$BODY" in *"[skip ci]"*|*"[ci skip]"*) continue ;; esac
              SRC_BRANCH=""
              ENTRY="$SUBJECT"
            fi

            case "$SRC_BRANCH" in
              fix/*)   R=1 ;;
              major/*) R=3 ;;
              *)       R=2 ;;
            esac
            [ "$R" -gt "$RANK" ] && RANK=$R

            echo "  ${SRC_BRANCH:-<no PR>} -> $ENTRY"
            printf '%s\n' "$ENTRY" >> /tmp/release-entries.txt
          done

          if [ "$RANK" -eq 0 ]; then
            echo "Nothing to release: an earlier run already released these changes."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$RANK" in
            1) LEVEL=patch ;;
            2) LEVEL=minor ;;
            3) LEVEL=major ;;
          esac
          echo "Bump level: $LEVEL"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"

      - name: Bump version (package.json + package-lock.json)
        id: version
        if: steps.bump.outputs.skip != 'true'
        run: |
          set -euo pipefail
          OLD_VERSION=$(node -p "require('./package.json').version")
          npm version "${{ steps.bump.outputs.level }}" --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")

          echo "old_version=$OLD_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update changelog.md, demo.md and web/index.html
        if: steps.bump.outputs.skip != 'true'
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs = require('fs');

          const version = process.env.NEW_VERSION.trim();
          const entries = fs.readFileSync('/tmp/release-entries.txt', 'utf8')
            .split('\n').map((line) => line.trim()).filter(Boolean);
          const items = (entries.length ? entries : ['Maintenance update']).map((e) => `- ${e}`).join('\n');
          const [major, minor, patch] = version.split('.').map(Number);

          const slug = (minor === 0 && patch === 0) ? `map${major}`
                     : (patch === 0) ? `map${major}${minor}`
                     : `map${major}${minor}${patch}`;
          const label = (patch === 0) ? `v${major}.${minor}` : `v${major}.${minor}.${patch}`;

          // changelog.md
          const changelogPath = 'changelog.md';
          const changelog = fs.readFileSync(changelogPath, 'utf8');
          const date = new Date().toISOString().slice(0, 10);
          const entry = `## [${version}] - ${date}\n\n### Changed\n${items}\n\n`;
          const marker = 'All notable changes to this project will be documented in this file.\n\n';
          const idx = changelog.indexOf(marker);
          const insertAt = idx === -1 ? 0 : idx + marker.length;
          fs.writeFileSync(changelogPath, changelog.slice(0, insertAt) + entry + changelog.slice(insertAt));

          // demo.md (this project appends newest entry at the bottom)
          const demoPath = 'demo.md';
          const demo = fs.readFileSync(demoPath, 'utf8').replace(/\n+$/, '');
          fs.writeFileSync(demoPath, `${demo}\n- [Demo ${label}](http://demo.catalunyamedieval.es/${slug})\n`);

          // web/index.html (preserve each tag's own V/v capitalisation)
          const htmlPath = 'web/index.html';
          const html = fs.readFileSync(htmlPath, 'utf8');
          const updatedHtml = html.replace(/Demo ([Vv])\d+(\.\d+){1,2}/g, (_, vChar) => `Demo ${vChar}${label.slice(1)}`);
          fs.writeFileSync(htmlPath, updatedHtml);

          // Release notes reused for the GitHub Release
          fs.writeFileSync('/tmp/release-notes.md', `## ${label}\n\n### Changed\n${items}\n`);
          JS

      - name: Commit, tag and push
        id: push
        if: steps.bump.outputs.skip != 'true'
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          OLD_VERSION: ${{ steps.version.outputs.old_version }}
        run: |
          set -euo pipefail
          git add package.json package-lock.json changelog.md demo.md web/index.html
          git commit -m "Bump version: ${OLD_VERSION} -> ${NEW_VERSION}"

          # main may have moved while this ran. Commits that start no release of
          # their own (skip-ci docs) are rebased under the bump. Anything else is
          # a merged PR whose run is queued behind this one and will release
          # everything since the last tag, this run's PRs included: stand down
          # rather than tag over a PR this changelog does not describe.
          git fetch -q origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            for SHA in $(git rev-list HEAD..origin/main); do
              case "$(git log -1 --format=%B "$SHA")" in
                *"[skip ci]"*) ;;
                *)
                  echo "::notice::main moved on during the release ($(git log -1 --format=%s "$SHA")); the queued run releases these changes too"
                  echo "pushed=false" >> "$GITHUB_OUTPUT"
                  exit 0
                  ;;
              esac
            done
            git rebase -q origin/main
          fi

          git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"
          git push --atomic origin HEAD:main "v${NEW_VERSION}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          gh release create "v${NEW_VERSION}" \
            --title "v${NEW_VERSION}" \
            --notes-file /tmp/release-notes.md \
            --latest
